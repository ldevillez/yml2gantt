# The smallest useful file: three entries, and no chart length (the
# chart ends after the last task, at the end of that week).
# Draw it with:  yml2gantt examples/minimal.yml

gantt:
  start: 2026-01-05

tasks:
  - {name: Write, duration: 2w}
  - {name: Review, start: 2w, duration: 1w}
  - {name: Ship, start: 3w, milestone: true}
