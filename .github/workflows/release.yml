# Publishes a release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# 1. build: checks the tag matches the version in pyproject.toml,
#    builds the package and draws the examples with it.
# 2. pypi: uploads to PyPI with Trusted Publishing (no token needed).
# 3. github-release: creates the GitHub release, with the changelog
#    section of this version as notes and the built files attached.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Draw the examples with the built wheel
        env:
          MPLBACKEND: Agg
        run: |
          pip install dist/*.whl
          for f in examples/*.yml; do yml2gantt "$f" -o /tmp/out.png --no-show; done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yml2gantt/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Notes: the "## [version]" section of CHANGELOG.md.
          awk -v v="$version" '
            /^## \[/ { keep = index($0, "[" v "]") > 0; next }
            /^\[[^]]*\]: / { next }
            keep' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
